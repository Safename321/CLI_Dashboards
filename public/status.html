<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLI Dashboards — Deploy Log</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; color: #22d3ee; margin-bottom: 0.5rem; }
  .sub { color: #64748b; font-size: 0.85rem; margin-bottom: 2rem; }
  .live { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .entry { border: 1px solid #1e293b; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; background: #1e293b; }
  .entry.new { animation: flash 1s ease-out; }
  @keyframes flash { 0% { background: #164e63; border-color: #22d3ee; } 100% { background: #1e293b; border-color: #1e293b; } }
  .version { color: #22d3ee; font-weight: 700; font-size: 1.1rem; }
  .msg { color: #f1f5f9; margin: 0.3rem 0; }
  .meta { color: #64748b; font-size: 0.8rem; }
  .empty { color: #475569; font-style: italic; }
  .toast { position: fixed; top: 1rem; right: 1rem; background: #164e63; border: 1px solid #22d3ee; border-radius: 8px; padding: 0.75rem 1.25rem; color: #22d3ee; font-size: 0.9rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1><span class="live"></span> CLI Dashboards — Deploy Log</h1>
<p class="sub">Live — updates automatically when a new deploy lands.</p>
<div class="toast" id="toast">New deploy detected!</div>
<div id="log"><p class="empty">Loading...</p></div>
<script>
let known = 0;

function render(entries) {
  const el = document.getElementById('log');
  if (!entries.length) { el.innerHTML = '<p class="empty">No deployments yet.</p>'; return; }
  const isNew = known > 0 && entries.length > known;
  known = entries.length;
  el.innerHTML = entries.slice().reverse().map((e, i) =>
    `<div class="entry${i === 0 && isNew ? ' new' : ''}">
      <span class="version">${e.version}</span>
      <p class="msg">${e.message}</p>
      <div class="meta">${e.deployer} &middot; ${e.ip} &middot; ${e.time}</div>
    </div>`).join('');
  if (isNew) {
    const toast = document.getElementById('toast');
    toast.textContent = 'New deploy: ' + entries[entries.length - 1].version;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
    // Play notification chime
    const ctx = new AudioContext();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.4);
    });
    if (Notification.permission === 'granted') {
      new Notification('CLI Dashboards deployed', { body: entries[entries.length - 1].version + ' — ' + entries[entries.length - 1].message });
    }
  }
}

async function poll() {
  try {
    const r = await fetch('/deploy-log.json?t=' + Date.now());
    if (r.ok) render(await r.json());
  } catch {}
}

// Initial load
poll();
// Poll every 30 seconds
setInterval(poll, 30000);
// Request browser notification permission
if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
