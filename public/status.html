<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLI Dashboards — Live Feed</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
  h1 { font-size: 1.4rem; color: #22d3ee; margin-bottom: 0.5rem; }
  .sub { color: #64748b; font-size: 0.85rem; margin-bottom: 1rem; }
  .code { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 0.5rem 0.75rem; font-family: monospace; font-size: 0.8rem; color: #94a3b8; margin-bottom: 2rem; word-break: break-all; }
  .live { display: inline-block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .entry { border: 1px solid #1e293b; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; background: #1e293b; animation: fadein 0.3s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .title { color: #22d3ee; font-weight: 700; font-size: 1rem; }
  .msg { color: #f1f5f9; margin: 0.3rem 0; white-space: pre-wrap; }
  .meta { color: #64748b; font-size: 0.8rem; }
  .empty { color: #475569; font-style: italic; }
  .toast { position: fixed; top: 1rem; right: 1rem; background: #164e63; border: 1px solid #22d3ee; border-radius: 8px; padding: 0.75rem 1.25rem; color: #22d3ee; font-size: 0.9rem; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<h1><span class="live"></span> CLI Dashboards — Live Feed</h1>
<p class="sub">Messages appear instantly. Send from anywhere:</p>
<div class="code">curl -d "your message" https://ntfy.sh/clidash-3dd4654f0f939b8cc5</div>
<div class="toast" id="toast">New message!</div>
<div id="feed"><p class="empty">Waiting for messages...</p></div>
<script>
const TOPIC = 'https://ntfy.sh/clidash-3dd4654f0f939b8cc5/sse';
const feed = document.getElementById('feed');
const toast = document.getElementById('toast');
let first = true;

function chime() {
  try {
    const ctx = new AudioContext();
    const now = ctx.currentTime;
    [523.25, 659.25, 783.99].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, now + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.4);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.15);
      osc.stop(now + i * 0.15 + 0.4);
    });
  } catch {}
}

function addEntry(title, message, time) {
  if (first) { feed.innerHTML = ''; first = false; }
  const d = new Date(time * 1000);
  const div = document.createElement('div');
  div.className = 'entry';
  div.innerHTML = (title ? '<div class="title">' + title + '</div>' : '') +
    '<div class="msg">' + message + '</div>' +
    '<div class="meta">' + d.toLocaleString() + '</div>';
  feed.prepend(div);

  toast.textContent = title || 'New message';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
  chime();

  if (Notification.permission === 'granted') {
    new Notification(title || 'CLI Dashboards', { body: message });
  }
}

// Connect to ntfy.sh via Server-Sent Events (real-time, no polling)
const evtSource = new EventSource(TOPIC);
evtSource.onmessage = (e) => {
  try {
    const data = JSON.parse(e.data);
    if (data.event === 'message') {
      addEntry(data.title || '', data.message || '', data.time || Date.now()/1000);
    }
  } catch {}
};
evtSource.onerror = () => {
  console.log('SSE reconnecting...');
};

// Also load deploy log history
fetch('/deploy-log.json').then(r => r.json()).then(entries => {
  entries.slice().reverse().forEach(e => {
    if (first) { feed.innerHTML = ''; first = false; }
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = '<div class="title">Deploy: ' + e.version + '</div>' +
      '<div class="msg">' + e.message + '</div>' +
      '<div class="meta">' + e.deployer + ' &middot; ' + e.ip + ' &middot; ' + e.time + '</div>';
    feed.appendChild(div);
  });
}).catch(() => {});

if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
